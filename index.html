<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Dashboard Demo</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-surface: #1e1e1e;
            --bg-sidebar: #181818;
            --accent: #00adb5;
            --text-main: #eeeeee;
            --text-muted: #95a5a6;
            --border: #2c2c2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* App Container Layout */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-surface);
            color: var(--text-main);
        }

        .nav-item.active {
            border-left: 4px solid var(--accent);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        /* Landing/Intro Screen View */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .hero-section {
            text-align: center;
            max-width: 600px;
            margin: 80px auto 0 auto;
        }

        .hero-section h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #008c92;
        }

        .btn-secondary {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #282828;
        }

        /* Features List View */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .feature-card {
            background-color: var(--bg-surface);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

            color: var(--accent);
            margin-bottom: 12px;
        }
